name: Carousel Pipeline
# 2026-10-05: 옛 자동 생성(분석 리포트 류)은 반복성 때문에 중단. 새 '도움글' 캐러셀은
# marketing_sets 큐에 직접 적재 → 텔레그램 승인 → ig-publish 흐름으로 운영한다.
# 스케줄 제거(자동 생성 off). 필요하면 workflow_dispatch 로 수동 실행만 가능.
on:
  workflow_dispatch: {}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet Pillow numpy requests
      - name: Fetch fonts & logo
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: bash carousel/bootstrap.sh
      - name: Generate & enqueue carousels
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 carousel/run_weekly.py
